<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Warm Foodie Gradients -->
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#DD2476"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD194"/>
      <stop offset="100%" stop-color="#D1913C"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#DD2476" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- NO BACKGROUND = 100% TRANSPARENT CANVAS -->

  <!-- Icon Group (Centered vertically) -->
  <g filter="url(#softShadow)" transform="translate(0, 100)">
    <!-- Steam / Flavor Rays -->
    <path d="M 210 50 Q 215 30 210 15" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 250 42 Q 255 22 250 5" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 290 50 Q 295 30 290 15" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Cloche / Plate Handle -->
    <circle cx="250" cy="70" r="16" fill="url(#foodGrad)"/>

    <!-- Main Cloche Dome -->
    <path d="M 120 210 A 130 130 0 0 1 380 210 Z" fill="url(#foodGrad)"/>

    <!-- Plate Base -->
    <rect x="90" y="222" width="320" height="20" rx="10" fill="url(#foodGrad)"/>

    <!-- Cutout Emblems: Fork & Spoon -->
    <g fill="#FFFFFF">
      <!-- Fork -->
      <path d="M 215 130 V 185 H 223 V 130 H 228 V 160 C 228 172 210 172 210 160 V 130 H 215 Z"/>
      <rect x="217" y="170" width="4" height="25" rx="2"/>

      <!-- Spoon -->
      <path d="M 280 130 C 268 130 268 165 280 165 C 292 165 292 130 280 130 Z"/>
      <rect x="278" y="165" width="4" height="30" rx="2"/>
    </g>
  </g>
</svg>
